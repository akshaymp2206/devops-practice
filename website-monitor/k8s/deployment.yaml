
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: website-monitor
  template:
    metadata:
      labels:
        app: website-monitor
    spec:
      containers:
        - name: website-monitor
          image: website-monitor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 20
